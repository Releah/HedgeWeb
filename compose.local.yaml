services:
  vpn-agent:
    build: ./vpn-agent
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    cap_add:
      - NET_ADMIN
    cap_drop:
      - ALL
    devices:
      - /dev/net/tun:/dev/net/tun
    security_opt:
      - no-new-privileges:true
    read_only: true
    pids_limit: 128
    mem_limit: 256m
    tmpfs:
      - /run/vpn:size=2m,nosuid,nodev,noexec,mode=0700
  hedgeweb:
    build: .
    restart: unless-stopped
    network_mode: "service:vpn-agent"
    depends_on:
      - vpn-agent
    env_file:
      - .env.docker
    volumes:
      - hedgeweb-data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    pids_limit: 128
    mem_limit: 512m
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
  browser:
    image: ghcr.io/linuxserver/chromium:version-b0ddd401@sha256:47fc8bb18cdb0844199a16e1e14b3b38ba97f6ad1659895c243ba5f2384aad1e
    restart: unless-stopped
    network_mode: "service:vpn-agent"
    depends_on:
      - vpn-agent
    environment:
      SUBFOLDER: /browser-worker/
      TITLE: HedgeWeb Secure Browser
      NO_DECOR: "true"
      START_DOCKER: "false"
      DISABLE_DRI: "true"
      SELKIES_MICROPHONE_ENABLED: "false"
      SELKIES_GAMEPAD_ENABLED: "false"
      SELKIES_COMMAND_ENABLED: "false"
      SELKIES_FILE_TRANSFERS: none
      SELKIES_ENABLE_SHARING: "false"
      SELKIES_UI_SIDEBAR_SHOW_FILES: "false"
      SELKIES_UI_SIDEBAR_SHOW_APPS: "false"
      SELKIES_UI_SIDEBAR_SHOW_SHARING: "false"
      SELKIES_UI_SIDEBAR_SHOW_GAMEPADS: "false"
      TZ: Europe/London
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    mem_limit: 1536m
    shm_size: 1gb
    tmpfs:
      - /config:size=512m,nosuid,nodev,uid=0,gid=911,mode=0770
      - /tmp:size=256m,nosuid,nodev

volumes:
  hedgeweb-data:
