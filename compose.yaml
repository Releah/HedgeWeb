services:
  vpn-agent:
    build: ./vpn-agent
    restart: unless-stopped
    networks:
      proxy:
        aliases:
          - hedgeweb
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    security_opt:
      - no-new-privileges:true
    read_only: true
    pids_limit: 128
    mem_limit: 256m
    tmpfs:
      - /run/vpn:size=2m,nosuid,nodev,noexec,mode=0700
  hedgeweb:
    build: .
    restart: unless-stopped
    network_mode: "service:vpn-agent"
    depends_on:
      - vpn-agent
    environment:
      PORT: 8080
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN}
      AUTH_MODE: ${AUTH_MODE:-both}
      COOKIE_SECURE: "true"
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-12}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      TRUSTED_PROXY_IPS: ${TRUSTED_PROXY_IPS}
      AUTHENTIK_ADMIN_GROUP: ${AUTHENTIK_ADMIN_GROUP:-HedgeWeb Admins}
      VPN_CONFIG_KEY_FILE: /run/secrets/vpn_config_key
    secrets:
      - vpn_config_key
    volumes:
      - hedgeweb-data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    pids_limit: 128
    mem_limit: 512m
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
  browser:
    image: ghcr.io/linuxserver/chromium:version-b0ddd401@sha256:47fc8bb18cdb0844199a16e1e14b3b38ba97f6ad1659895c243ba5f2384aad1e
    restart: unless-stopped
    network_mode: "service:vpn-agent"
    depends_on:
      - vpn-agent
    environment:
      SUBFOLDER: /browser-worker/
      TITLE: HedgeWeb Secure Browser
      NO_DECOR: "true"
      START_DOCKER: "false"
      DISABLE_DRI: "true"
      SELKIES_MICROPHONE_ENABLED: "false"
      SELKIES_GAMEPAD_ENABLED: "false"
      SELKIES_COMMAND_ENABLED: "false"
      SELKIES_FILE_TRANSFERS: none
      SELKIES_ENABLE_SHARING: "false"
      SELKIES_UI_SIDEBAR_SHOW_FILES: "false"
      SELKIES_UI_SIDEBAR_SHOW_APPS: "false"
      SELKIES_UI_SIDEBAR_SHOW_SHARING: "false"
      SELKIES_UI_SIDEBAR_SHOW_GAMEPADS: "false"
      TZ: ${TZ:-Etc/UTC}
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    mem_limit: 1536m
    shm_size: 1gb
    tmpfs:
      - /config:size=512m,nosuid,nodev,uid=0,gid=911,mode=0770
      - /tmp:size=256m,nosuid,nodev

volumes:
  hedgeweb-data:

secrets:
  vpn_config_key:
    file: ./secrets/vpn_config_key

networks:
  proxy:
    external: true
